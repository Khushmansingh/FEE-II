<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Scroll Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 5rem);
            letter-spacing: 2px;
            text-align: center;
        }

        .about {
            text-align: center;
            max-width: 700px;
            padding: 20px;
        }

        .about h2 {
            font-size: clamp(1.8rem, 6vw, 4rem);
            margin-bottom: 12px;
        }

        .about p {
            font-size: clamp(1rem, 2.2vw, 1.2rem);
            line-height: 1.6;
            color: #333;
        }

        .bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: 1;
        }

        .bg1 {
            background-image: url("pic 1.png");
        }

        .bg2 {
            background-image: url("pic 2.png");
        }
    </style>
</head>
<body>
    <section>
        <h1>WELCOME</h1>
    </section>

    <section class="bg bg1" aria-label="Background image 1">
    </section>

    <section>
        <div class="about">
            <h2>ABOUT</h2>
            <p>This is a basic scroll page with full-screen background image sections.</p>
        </div>
    </section>

    <section class="bg bg2" aria-label="Background image 2">
    </section>

    <section>
        <h1>THNX</h1>
    </section>
</body>
</html>
