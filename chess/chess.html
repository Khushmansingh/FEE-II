<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4x4 Chessboard</title>
    <style>
    body{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #ddd;
    }

    .board{
        display: flex;
        flex-direction: column;
        border: 4px solid black;
    }

    .row{
        display: flex;
    }

    .box{
        width: 80px;
        height: 80px;
    }

    .white{
        background: white;
    }

    .black{
        background: black;
    }
    </style>
</head>
<body>

<div class="board">
    <div class="row">
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
    </div>

    <div class="row">
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
    </div>

    <div class="row">
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
    </div>

    <div class="row">
        <div class="box black"></div>
        <div class="box white"></div>
        <div class="box black"></div>
        <div class="box white"></div>
    </div>
</div>

</body>
</html>
